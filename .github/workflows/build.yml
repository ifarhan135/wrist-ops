name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK. This step is only here to
      # accept licenses; its default package list still contains the obsolete
      # "tools" package, which no longer exists and fails the install.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Show SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No KEYSTORE_B64 secret set. Falling back to the debug key, which CI regenerates every run, so the watch will REFUSE to self-update onto this build. Add the secret before installing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wristops.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/wristops.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/wrist-ops-${{ github.run_number }}.apk"
          ls -lh out

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrist-ops-apk
          path: out/*.apk
          if-no-files-found: error

      # The watch updater reads this: tag "v<n>" means versionCode n.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            "out/wrist-ops-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "Signed: ${{ steps.keystore.outputs.signed }}. Open Wrist Ops on the watch and tap Check for update." \
            --latest

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wristops.jks"
